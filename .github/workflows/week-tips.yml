name: Week tips (daily)
on:
  schedule:
    - cron: "30 23 * * *"   # 07:30 台北
  workflow_dispatch:
jobs:
  tips:
    runs-on: ubuntu-latest
    steps:
      - name: Regenerate this week's marketing tips
        run: |
          curl -sS -X POST "https://asia-east1-vvdouble-shopline.cloudfunctions.net/fbpost" \
            -H "Content-Type: application/json" -H "X-Sync-Key: ${{ secrets.FBPOST_SYNC_KEY }}" \
            -d '{"action":"weekTipsAuto"}' | head -c 1500
