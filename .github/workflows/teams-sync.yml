name: Teams sync
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Teams photos to Dropbox
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -sS -X POST "https://asia-east1-vvdouble-shopline.cloudfunctions.net/fbpost" \
              -H "Content-Type: application/json" -H "X-Sync-Key: ${{ secrets.FBPOST_SYNC_KEY }}" \
              -d '{"action":"teamsSync","limit":40}')
            echo "$out" | head -c 2000; echo
            echo "$out" | grep -q '"more":true' || break
          done
