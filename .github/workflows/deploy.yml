name: Deploy fbpost function
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install function deps
        run: cd functions && npm install --no-audit --no-fund
      - name: Deploy function (codebase fbpost only)
        run: npx --yes firebase-tools@13 deploy --only functions:fbpost --project vvdouble-shopline --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Verify
        run: |
          sleep 10
          curl -s -X POST -H "Content-Type: application/json" -d '{"action":"version"}' "https://asia-east1-vvdouble-shopline.cloudfunctions.net/fbpost"
